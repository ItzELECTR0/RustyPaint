name: Build packages

on:
  workflow_call:

jobs:
  linux:
    name: AppImage, Debian and RPM ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The container, not the runner, decides which systems accept these packages, so it is the
    # oldest base the three formats target rather than the newest one available.
    container: almalinux:9
    steps:
      - name: Install build tools
        run: dnf install -y gcc gcc-c++ make file findutils which binutils gcc-toolset-14-binutils cmake python3.12 patch desktop-file-utils git tar
      - uses: actions/checkout@v6
      - name: Build the native cutout runtime for the Linux baseline
        env:
          COMPILER_PATH: /opt/rh/gcc-toolset-14/root/usr/bin
        run: |
          bash packaging/build-cutout-runtime.sh "$GITHUB_WORKSPACE/target/cutout-runtime"
          echo "ORT_LIB_PATH=$GITHUB_WORKSPACE/target/cutout-runtime/lib" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install package tools
        run: |
          cargo install cargo-packager --version 0.11.8 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked
      - name: Build AppImage and Debian packages
        # A job container has no FUSE, so the tools cargo-packager downloads unpack themselves.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo packager -p rustypaint --profile dist --formats appimage,deb
      - name: Build RPM package
        run: cargo generate-rpm -p crates/rustypaint --profile dist
      - name: Collect packages
        shell: bash
        run: |
          mkdir artifacts
          find target -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} artifacts/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-linux-packages-${{ matrix.arch }}
          path: artifacts
          if-no-files-found: error

  arch:
    name: Arch Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:base-devel
            keyring: archlinux-keyring
          - arch: aarch64
            runner: ubuntu-24.04-arm
            # Arch itself has no ARM port, so aarch64 comes from Arch Linux ARM. This image tracks
            # it and is rebuilt daily, which the other published ones are not.
            image: menci/archlinuxarm:base-devel
            keyring: archlinuxarm-keyring
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools
        # The keyring is as old as the image, and pacman's download sandbox wants a Landlock ruleset
        # that a container is not allowed to set up, which the official image already turns off.
        run: |
          pacman -Sy --noconfirm --disable-sandbox ${{ matrix.keyring }}
          pacman -Syu --noconfirm --disable-sandbox git rustup fontconfig libxkbcommon vulkan-icd-loader
      - uses: actions/checkout@v6
      - name: Create an unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Install Rust
        run: runuser -u builder -- rustup default stable
      - name: Build package
        # Arch Linux ARM still compresses with xz, and one asset name per format is worth more than
        # whichever compressor each side happens to prefer.
        run: |
          sed -i "s|^PKGEXT=.*|PKGEXT='.pkg.tar.zst'|" /etc/makepkg.conf
          runuser -u builder -- bash -lc 'cd "$GITHUB_WORKSPACE/packaging" && makepkg --noconfirm'
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-arch-package-${{ matrix.arch }}
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error

  alpine:
    name: Alpine ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      # Alpine runs as a plain container instead of the job's own, because the runner's Node is
      # linked against glibc and every action inside a musl job container fails on that alone.
      - name: Build Alpine package
        run: |
          mkdir artifacts
          docker run --rm -v "$PWD:/work" alpine:3.24 sh -c '
            set -eu
            apk add --no-cache alpine-sdk cargo fontconfig libxkbcommon vulkan-loader
            abuild-keygen -na
            cp /root/.abuild/*.rsa.pub /etc/apk/keys/
            cd /work/packaging/alpine
            abuild -F
            find /root/packages -name "*.apk" -exec cp {} /work/artifacts/ \;
          '
      - name: Name the package for its architecture
        # abuild puts the architecture in the directory it writes to rather than in the file name,
        # and a release has nowhere to keep that.
        run: |
          for package in artifacts/*.apk; do
            mv "$package" "${package%.apk}-${{ matrix.arch }}.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-alpine-package-${{ matrix.arch }}
          path: artifacts
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            triple: x86_64-pc-windows-msvc
            formats: wix,nsis
          - arch: aarch64
            triple: aarch64-pc-windows-msvc
            # WiX 3 has no arm64 architecture at all and cargo-packager pins it by checksum, so on
            # ARM the NSIS installer is the only one there is.
            formats: nsis
    # Both architectures on the x86 runner, since that is where the installer toolchains run.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust
        run: |
          rustup default stable
          rustup target add ${{ matrix.triple }}
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build the CPU-only native cutout runtime
        shell: pwsh
        run: ./packaging/windows/build-cutout-runtime.ps1 -Architecture ${{ matrix.arch }}
      - name: Build installers
        # The packager hands its build hook no arguments of ours, and cargo reads the target from
        # the environment, so this is what makes that hook cross-compile.
        env:
          CARGO_BUILD_TARGET: ${{ matrix.triple }}
        run: cargo packager -p rustypaint --profile dist --formats ${{ matrix.formats }} --target ${{ matrix.triple }}
      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts
          Get-ChildItem -Path target -Recurse -Include *.msi, *-setup.exe | Copy-Item -Destination artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-windows-${{ matrix.arch }}
          path: artifacts
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.name }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            artifact: aarch64
          - name: Intel
            runner: macos-15-intel
            artifact: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust
        run: rustup default stable
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build disk image
        run: cargo packager -p rustypaint --profile dist --formats dmg
      - name: Collect disk image
        run: |
          mkdir artifacts
          find target -type f -name '*.dmg' -exec cp {} artifacts/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-macos-${{ matrix.artifact }}
          path: artifacts
          if-no-files-found: error

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/net.electris.RustyPaint.yml
          bundle: RustyPaint-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-flatpak-${{ matrix.arch }}
          path: RustyPaint-${{ matrix.arch }}.flatpak
          if-no-files-found: error
