name: Build packages

on:
  workflow_call:

jobs:
  linux:
    name: AppImage, Debian and RPM ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The container, not the runner, decides which systems accept these packages, so it is the
    # oldest base the three formats target rather than the newest one available.
    container: almalinux:9
    steps:
      - name: Install build tools
        run: dnf install -y gcc make file findutils which binutils desktop-file-utils git tar
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install package tools
        run: |
          cargo install cargo-packager --version 0.11.8 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked
      - name: Build AppImage and Debian packages
        # A job container has no FUSE, so the tools cargo-packager downloads unpack themselves.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo packager -p rustypaint --profile dist --formats appimage,deb
      - name: Build RPM package
        run: cargo generate-rpm -p crates/rustypaint --profile dist
      - name: Collect packages
        shell: bash
        run: |
          mkdir artifacts
          find target -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} artifacts/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-linux-packages-${{ matrix.arch }}
          path: artifacts
          if-no-files-found: error

  arch:
    name: Arch Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:base-devel
            keyring: archlinux-keyring
          - arch: aarch64
            runner: ubuntu-24.04-arm
            # Arch itself has no ARM port, so aarch64 comes from Arch Linux ARM. This image tracks
            # it and is rebuilt daily, which the other published ones are not.
            image: menci/archlinuxarm:base-devel
            keyring: archlinuxarm-keyring
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools
        # A container's keyring is as old as the image, and an expired key fails every later install.
        run: |
          pacman -Sy --noconfirm ${{ matrix.keyring }}
          pacman -Syu --noconfirm git rustup fontconfig libxkbcommon vulkan-icd-loader
      - uses: actions/checkout@v6
      - name: Create an unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Install Rust
        run: runuser -u builder -- rustup default stable
      - name: Build package
        # Arch Linux ARM still compresses with xz, and one asset name per format is worth more than
        # whichever compressor each side happens to prefer.
        run: |
          sed -i "s|^PKGEXT=.*|PKGEXT='.pkg.tar.zst'|" /etc/makepkg.conf
          runuser -u builder -- bash -lc 'cd "$GITHUB_WORKSPACE/packaging" && makepkg --noconfirm'
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-arch-package-${{ matrix.arch }}
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: Windows MSI ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            triple: x86_64-pc-windows-msvc
          - arch: aarch64
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust
        # The ARM image carries a smaller tool set than the x86 one, so rustup may not be on it.
        shell: pwsh
        run: |
          if (Get-Command rustup -ErrorAction SilentlyContinue) {
            rustup default stable
          } else {
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/${{ matrix.triple }}/rustup-init.exe" -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain stable --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build installer
        run: cargo packager -p rustypaint --profile dist --formats wix
      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts
          Get-ChildItem -Path target -Recurse -Filter *.msi | Copy-Item -Destination artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-windows-${{ matrix.arch }}
          path: artifacts
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.name }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            artifact: aarch64
          - name: Intel
            runner: macos-15-intel
            artifact: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust
        run: rustup default stable
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build disk image
        run: cargo packager -p rustypaint --profile dist --formats dmg
      - name: Collect disk image
        run: |
          mkdir artifacts
          find target -type f -name '*.dmg' -exec cp {} artifacts/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-macos-${{ matrix.artifact }}
          path: artifacts
          if-no-files-found: error

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/net.electris.RustyPaint.yml
          bundle: RustyPaint-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-flatpak-${{ matrix.arch }}
          path: RustyPaint-${{ matrix.arch }}.flatpak
          if-no-files-found: error
