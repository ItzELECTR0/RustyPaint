name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    name: AppImage, Debian and RPM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust
        run: rustup default stable
      - name: Install package tools
        run: |
          cargo install cargo-packager --version 0.11.8 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked
      - name: Build AppImage and Debian packages
        run: cargo packager -p rustypaint --profile dist --formats appimage,deb
      - name: Build RPM package
        run: cargo generate-rpm -p crates/rustypaint --profile dist
      - name: Collect packages
        shell: bash
        run: |
          mkdir artifacts
          find target -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} artifacts/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-linux-packages
          path: artifacts
          if-no-files-found: error

  arch:
    name: Arch Linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm git rustup fontconfig libxkbcommon vulkan-icd-loader
      - uses: actions/checkout@v6
      - name: Create an unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Install Rust
        run: runuser -u builder -- rustup default stable
      - name: Build package
        run: runuser -u builder -- bash -lc 'cd "$GITHUB_WORKSPACE/packaging" && makepkg --noconfirm'
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-arch-package
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: Windows MSI
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust
        run: rustup default stable
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build installer
        run: cargo packager -p rustypaint --profile dist --formats wix
      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts
          Get-ChildItem -Path target -Recurse -Filter *.msi | Copy-Item -Destination artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-windows-x86_64
          path: artifacts
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.name }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            artifact: aarch64
          - name: Intel
            runner: macos-15-intel
            artifact: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust
        run: rustup default stable
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build disk image
        run: cargo packager -p rustypaint --profile dist --formats dmg
      - name: Collect disk image
        run: |
          mkdir artifacts
          find target -type f -name '*.dmg' -exec cp {} artifacts/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-macos-${{ matrix.artifact }}
          path: artifacts
          if-no-files-found: error

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/net.electris.RustyPaint.yml
          bundle: RustyPaint-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: rustypaint-flatpak-${{ matrix.arch }}
          path: RustyPaint-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, arch, windows, macos, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rustypaint-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
