app-id: net.electris.RustyPaint
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rustypaint

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: rustypaint
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/rustypaint/cargo
        CARGO_NET_OFFLINE: 'true'
        ORT_LIB_PATH: /run/build/rustypaint/onnxruntime
    build-commands:
      - mkdir -p onnxruntime
      - xz --decompress --stdout --format=raw --lzma2=dict=64MiB onnxruntime.tar.lzma2 | tar -xf - -C onnxruntime
      - cargo build --offline --profile dist -p rustypaint
      - install -Dm755 target/dist/rustypaint /app/bin/rustypaint
      - install -Dm644 packaging/net.electris.RustyPaint.desktop /app/share/applications/net.electris.RustyPaint.desktop
      - sed -i 's/^Icon=rustypaint$/Icon=net.electris.RustyPaint/' /app/share/applications/net.electris.RustyPaint.desktop
      - install -Dm644 packaging/flatpak/net.electris.RustyPaint.metainfo.xml /app/share/metainfo/net.electris.RustyPaint.metainfo.xml
      - install -Dm644 packaging/mime/net.electris.RustyPaint.xml /app/share/mime/packages/net.electris.RustyPaint.xml
      - install -Dm644 LICENSE /app/share/licenses/net.electris.RustyPaint/LICENSE
      - for size in 16 24 32 48 64 128 256 512; do install -Dm644 res/icons/icon-$size.png /app/share/icons/hicolor/${size}x${size}/apps/net.electris.RustyPaint.png; done
    sources:
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - .git
          - target
      - cargo-sources.json
      - type: file
        url: https://cdn.pyke.io/0/pyke:ort-rs/ms@1.28.0/x86_64-unknown-linux-gnu.tar.lzma2
        sha256: e454f710f8a49f53aa5b4ff51e3454ae1835777e431c6c35c5255ce6f205fd68
        dest-filename: onnxruntime.tar.lzma2
        only-arches: [x86_64]
      - type: file
        url: https://cdn.pyke.io/0/pyke:ort-rs/ms@1.28.0/aarch64-unknown-linux-gnu.tar.lzma2
        sha256: 06a050ab9137ccb32421d0cb49e9ccf72d9e18ab0aeb8f8d038d1b5cc844b35a
        dest-filename: onnxruntime.tar.lzma2
        only-arches: [aarch64]
