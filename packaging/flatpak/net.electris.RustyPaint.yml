app-id: net.electris.RustyPaint
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rustypaint

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: rustypaint
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/rustypaint/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --offline --profile dist -p rustypaint
      - install -Dm755 target/dist/rustypaint /app/bin/rustypaint
      - install -Dm644 packaging/net.electris.RustyPaint.desktop /app/share/applications/net.electris.RustyPaint.desktop
      - sed -i 's/^Icon=rustypaint$/Icon=net.electris.RustyPaint/' /app/share/applications/net.electris.RustyPaint.desktop
      - install -Dm644 packaging/flatpak/net.electris.RustyPaint.metainfo.xml /app/share/metainfo/net.electris.RustyPaint.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/net.electris.RustyPaint/LICENSE
      - for size in 16 24 32 48 64 128 256 512; do install -Dm644 res/icons/icon-$size.png /app/share/icons/hicolor/${size}x${size}/apps/net.electris.RustyPaint.png; done
    sources:
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - .git
          - target
      - cargo-sources.json
