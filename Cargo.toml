[workspace]
resolver = "3"
members = ["crates/rustypaint"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
