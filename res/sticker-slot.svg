<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The slot you put your own picture in. A checkerboard, which is what
       nothing behind it looks like, in the theme's own ink at two strengths
       so it reads on the light panel and the dark one alike. -->
  <rect x="0" y="0" width="32" height="32" fill="currentColor" opacity="0.12"/>
  <g fill="currentColor" opacity="0.3">
    <rect x="0" y="0" width="5.333" height="5.333"/>
    <rect x="10.67" y="0" width="5.333" height="5.333"/>
    <rect x="21.33" y="0" width="5.333" height="5.333"/>
    <rect x="5.333" y="5.333" width="5.333" height="5.333"/>
    <rect x="16" y="5.333" width="5.333" height="5.333"/>
    <rect x="26.67" y="5.333" width="5.333" height="5.333"/>
    <rect x="0" y="10.67" width="5.333" height="5.333"/>
    <rect x="10.67" y="10.67" width="5.333" height="5.333"/>
    <rect x="21.33" y="10.67" width="5.333" height="5.333"/>
    <rect x="5.333" y="16" width="5.333" height="5.333"/>
    <rect x="16" y="16" width="5.333" height="5.333"/>
    <rect x="26.67" y="16" width="5.333" height="5.333"/>
    <rect x="0" y="21.33" width="5.333" height="5.333"/>
    <rect x="10.67" y="21.33" width="5.333" height="5.333"/>
    <rect x="21.33" y="21.33" width="5.333" height="5.333"/>
    <rect x="5.333" y="26.67" width="5.333" height="5.333"/>
    <rect x="16" y="26.67" width="5.333" height="5.333"/>
    <rect x="26.67" y="26.67" width="5.333" height="5.333"/>
  </g>
</svg>
