[package]
name = "rustypaint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Paint 3D's 2D editor, without the 3D"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
iced = { version = "0.14.0", features = ["wgpu", "advanced", "image", "svg", "canvas"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
rfd = "0.17.2"
wgpu = "27"

# Shape rasterising: tiny-skia fills and strokes, usvg turns Paint 3D's own
# outlines into paths so there is no path parser to write or get wrong.
tiny-skia = "0.11"
usvg = "0.45"
cosmic-text = "0.15"

serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[dev-dependencies]
naga = { version = "27", features = ["wgsl-in"] }
pollster = "1.0.1"
ttf-parser = "0.25.1"
